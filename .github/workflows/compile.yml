name: Compile XiaoYi Pro DTS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install DTC and dependencies
      run: |
        sudo apt update
        sudo apt install -y device-tree-compiler git

    - name: Clone CoreELEC kernel
      run: |
        git clone --depth=1 https://github.com/CoreELEC/linux-amlogic.git /tmp/linux-amlogic
        echo "=== Kernel cloned ==="

    - name: Create DTS file
      run: |
        cat > meson-g12b-xiaoyi-pro.dts << "EOF"
        /dts-v1/;
        
        #include "/tmp/linux-amlogic/arch/arm64/boot/dts/amlogic/meson-g12b-s922x.dtsi"
        #include <dt-bindings/gpio/gpio.h>
        #include <dt-bindings/input/input.h>
        
        / {
            model = "CAINIAO XiaoYi Pro";
            compatible = "cainiao,xiaoyi-pro", "amlogic,s922x";
        
            chosen {
                bootargs = "root=LABEL=COREELEC rw console=ttyAML0,115200n8 console=tty0 no_console_suspend";
            };
        
            memory@0 {
                device_type = "memory";
                reg = <0x0 0x0 0x0 0xee6b2800>;
            };
        
            dc_in: regulator-dc-in {
                compatible = "regulator-fixed";
                regulator-name = "dc_in";
                regulator-always-on;
                regulator-boot-on;
            };
        
            vsys_3v3: regulator-vsys-3v3 {
                compatible = "regulator-fixed";
                regulator-name = "vsys_3v3";
                regulator-always-on;
                regulator-boot-on;
                regulator-min-microvolt = <3300000>;
                regulator-max-microvolt = <3300000>;
                vin-supply = <&dc_in>;
            };
        
            vddao_1v8: regulator-vddao-1v8 {
                compatible = "regulator-fixed";
                regulator-name = "vddao_1v8";
                regulator-always-on;
                regulator-boot-on;
                regulator-min-microvolt = <1800000>;
                regulator-max-microvolt = <1800000>;
                vin-supply = <&dc_in>;
            };
        
            host_vbus: regulator-host-vbus {
                compatible = "regulator-fixed";
                regulator-name = "host_vbus";
                regulator-always-on;
                regulator-boot-on;
                gpio = <&gpio GPIOH_5 GPIO_ACTIVE_HIGH>;
                enable-active-high;
            };
        
            gpio_fan: gpio-fan {
                compatible = "gpio-fan";
                gpios = <&gpio_ao GPIOAO_11 GPIO_ACTIVE_HIGH>;
                gpio-fan,speed-map = <0 0 3000 1>;
                #cooling-cells = <2>;
            };
        
            adc_keys: adc-keys {
                compatible = "adc-keys";
                io-channels = <&saradc 2>;
                io-channel-names = "buttons";
                keyup-threshold-microvolt = <1700000>;
                poll-interval = <100>;
        
                button-recovery {
                    label = "Recovery";
                    linux,code = <KEY_RESTART>;
                    press-threshold-microvolt = <10000>;
                };
            };
        
            vdd_amp: regulator-vdd-amp {
                compatible = "regulator-fixed";
                regulator-name = "vdd_amp";
                regulator-always-on;
                regulator-boot-on;
            };
        
            wifi32k: wifi32k {
                compatible = "pwm-clock";
                #clock-cells = <0>;
                clock-frequency = <32768>;
                pwms = <&pwm_ef 0 30518 0>;
            };
        
            sdio_pwrseq: sdio-pwrseq {
                compatible = "mmc-pwrseq-simple";
                clocks = <&wifi32k>;
                clock-names = "ext_clock";
                reset-gpios = <&gpio GPIOX_7 GPIO_ACTIVE_LOW>;
            };
        
            speaker_amplifier: speaker-amplifier {
                compatible = "simple-audio-amplifier";
                sound-name-prefix = "Speaker Amplifier";
                VCC-supply = <&vdd_amp>;
                enable-gpios = <&gpio GPIOH_5 GPIO_ACTIVE_HIGH>;
            };
        };
        
        &sd_emmc_c {
            status = "okay";
            bus-width = <8>;
            non-removable;
            cap-mmc-highspeed;
            mmc-ddr-1_8v;
            mmc-hs200-1_8v;
            max-frequency = <200000000>;
            vmmc-supply = <&vsys_3v3>;
            vqmmc-supply = <&vddao_1v8>;
        };
        
        &sd_emmc_a {
            status = "okay";
            bus-width = <4>;
            cap-sd-highspeed;
            sd-uhs-ddr50;
            max-frequency = <200000000>;
            non-removable;
            keep-power-in-suspend;
            vmmc-supply = <&vsys_3v3>;
            vqmmc-supply = <&vddao_1v8>;
            mmc-pwrseq = <&sdio_pwrseq>;
        };
        
        &uart_AO {
            status = "okay";
        };
        
        &usb {
            status = "okay";
            dr_mode = "host";
        };
        
        &usb2_phy0 {
            status = "okay";
            phy-supply = <&vsys_3v3>;
        };
        
        &usb2_phy1 {
            status = "okay";
            phy-supply = <&host_vbus>;
        };
        
        ðmac {
            status = "okay";
            phy-mode = "rgmii";
        };
        
        &hdmi_tx {
            status = "okay";
        };
        
        &vpu {
            status = "okay";
        };
        
        &fb {
            status = "okay";
        };
        
        &cec_AO {
            status = "okay";
        };
        
        &ir {
            status = "okay";
        };
        
        &pwm_ab {
            status = "okay";
        };
        
        &pwm_ef {
            status = "okay";
        };
        
        &pwm_AO_cd {
            status = "okay";
        };
        
        &saradc {
            status = "okay";
            vref-supply = <&vddao_1v8>;
        };
        
        &watchdog {
            status = "okay";
        };
        
        &vrtc {
            status = "okay";
        };
        
        &i2c1 {
            status = "okay";
            led-controller@45 {
                compatible = "awinic,aw2013";
                reg = <0x45>;
                #address-cells = <1>;
                #size-cells = <0>;
        
                led@0 {
                    reg = <0>;
                    led-max-microamp = <5000>;
                };
        
                led@1 {
                    reg = <1>;
                    led-max-microamp = <5000>;
                };
        
                led@2 {
                    reg = <2>;
                    led-max-microamp = <5000>;
                };
            };
        };
        
        &i2c2 {
            status = "okay";
            rtc@68 {
                compatible = "dallas,ds1307";
                reg = <0x68>;
            };
        };
        EOF
        
        echo "=== DTS file created ==="
        wc -l meson-g12b-xiaoyi-pro.dts

    - name: Preprocess DTS
      run: |
        cpp -nostdinc -undef -x assembler-with-cpp \
          -I /tmp/linux-amlogic/include \
          -I /tmp/linux-amlogic/arch/arm64/boot/dts \
          -I /tmp/linux-amlogic/arch/arm64/boot/dts/amlogic \
          -I /tmp/linux-amlogic/include/dt-bindings \
          meson-g12b-xiaoyi-pro.dts > meson-g12b-xiaoyi-pro.preprocessed.dts 2>&1 || true
        
        echo "=== Preprocessed DTS (first 30 lines) ==="
        head -30 meson-g12b-xiaoyi-pro.preprocessed.dts

    - name: Compile DTS to DTB
      run: |
        # 方法1: 使用内核的 DTC 编译
        echo "=== Method 1: Using kernel DTC ==="
        /tmp/linux-amlogic/scripts/dtc/dtc -I dts -O dtb \
          -o meson-g12b-xiaoyi-pro.dtb \
          meson-g12b-xiaoyi-pro.preprocessed.dts 2>&1 || true
        
        # 方法2: 使用系统 DTC
        if [ ! -f meson-g12b-xiaoyi-pro.dtb ]; then
          echo "=== Method 2: Using system DTC ==="
          dtc -I dts -O dtb \
            -o meson-g12b-xiaoyi-pro.dtb \
            meson-g12b-xiaoyi-pro.preprocessed.dts 2>&1 || true
        fi
        
        # 方法3: 直接编译原始文件
        if [ ! -f meson-g12b-xiaoyi-pro.dtb ]; then
          echo "=== Method 3: Direct compile ==="
          dtc -I dts -O dtb \
            -o meson-g12b-xiaoyi-pro.dtb \
            meson-g12b-xiaoyi-pro.dts 2>&1 || true
        fi
        
        # 检查结果
        if [ -f meson-g12b-xiaoyi-pro.dtb ]; then
          echo "=== Compilation successful ==="
          dtc -I dtb -O dts -o meson-g12b-xiaoyi-pro.decompiled.dts meson-g12b-xiaoyi-pro.dtb
          ls -la *.dtb
          file meson-g12b-xiaoyi-pro.dtb
        else
          echo "=== Compilation failed ==="
          echo "Creating error log..."
          echo "DTB compilation failed. Please check the DTS syntax." > COMPILE_ERROR.txt
          # 显示预处理后的错误行
          grep -n "Error" meson-g12b-xiaoyi-pro.preprocessed.dts | head -20 || true
        fi

    - name: List output files
      run: |
        echo "=== Current directory contents ==="
        ls -la

    - name: Create release zip
      run: |
        RELEASE_ZIP="/tmp/dtbs.zip"
        zip -9 -r "$RELEASE_ZIP" *.dtb *.dts *.txt 2>/dev/null || true
        echo "RELEASE_ZIP=$RELEASE_ZIP" >> $GITHUB_ENV
        echo "=== ZIP contents ==="
        unzip -l "$RELEASE_ZIP" 2>/dev/null || echo "ZIP creation failed"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dtb-files
        path: |
          *.dtb
          *.dts
          *.txt
        retention-days: 7

    - name: Set release tag
      id: vars
      run: |
        TAG_NAME="v$(date +'%Y%m%d-%H%M%S')"
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
        echo "Release tag: $TAG_NAME"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        make_latest: true
        tag_name: ${{ env.TAG_NAME }}
        generate_release_notes: true
        files: |
          ${{ env.RELEASE_ZIP }}
