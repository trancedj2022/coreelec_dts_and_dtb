name: Compile XiaoYi Pro DTS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install DTC and dependencies
      run: |
        sudo apt update
        sudo apt install -y device-tree-compiler

    - name: Clone CoreELEC kernel (for DTS includes)
      run: |
        git clone --depth=1 https://github.com/CoreELEC/linux-amlogic.git /tmp/linux-amlogic
        echo "=== Checking DTSI files ==="
        ls -la /tmp/linux-amlogic/arch/arm64/boot/dts/amlogic/*.dtsi | head -10

    - name: Create DTS file
      run: |
        cat > meson-g12b-xiaoyi-pro.dts << 'EOF'
/dts-v1/;

#include "/tmp/linux-amlogic/arch/arm64/boot/dts/amlogic/meson-g12b-s922x.dtsi"
#include <dt-bindings/gpio/gpio.h>
#include <dt-bindings/input/input.h>

/ {
	model = "CAINIAO XiaoYi Pro";
	compatible = "cainiao,xiaoyi-pro", "amlogic,s922x";

	chosen {
		bootargs = "root=LABEL=COREELEC rw console=ttyAML0,115200n8 console=tty0 no_console_suspend";
	};

	memory@0 {
		device_type = "memory";
		reg = <0x0 0x0 0x0 0xee6b2800>;
	};

	/* 电源 */
	dc_in: regulator-dc-in {
		compatible = "regulator-fixed";
		regulator-name = "dc_in";
		regulator-always-on;
		regulator-boot-on;
	};

	vsys_3v3: regulator-vsys-3v3 {
		compatible = "regulator-fixed";
		regulator-name = "vsys_3v3";
		regulator-always-on;
		regulator-boot-on;
		regulator-min-microvolt = <3300000>;
		regulator-max-microvolt = <3300000>;
		vin-supply = <&dc_in>;
	};

	vddao_1v8: regulator-vddao-1v8 {
		compatible = "regulator-fixed";
		regulator-name = "vddao_1v8";
		regulator-always-on;
		regulator-boot-on;
		regulator-min-microvolt = <1800000>;
		regulator-max-microvolt = <1800000>;
		vin-supply = <&dc_in>;
	};

	host_vbus: regulator-host-vbus {
		compatible = "regulator-fixed";
		regulator-name = "host_vbus";
		regulator-always-on;
		regulator-boot-on;
		gpio = <&gpio GPIOH_5 GPIO_ACTIVE_HIGH>;
		enable-active-high;
	};

	gpio_fan: gpio-fan {
		compatible = "gpio-fan";
		gpios = <&gpio_ao GPIOAO_11 GPIO_ACTIVE_HIGH>;
		gpio-fan,speed-map = <0 0 3000 1>;
		#cooling-cells = <2>;
	};

	adc_keys: adc-keys {
		compatible = "adc-keys";
		io-channels = <&saradc 2>;
		io-channel-names = "buttons";
		keyup-threshold-microvolt = <1700000>;
		poll-interval = <100>;

		button-recovery {
			label = "Recovery";
			linux,code = <KEY_RESTART>;
			press-threshold-microvolt = <10000>;
		};
	};

	/* WiFi 32K 时钟 */
	wifi32k: wifi32k {
		compatible = "pwm-clock";
		#clock-cells = <0>;
		clock-frequency = <32768>;
		pwms = <&pwm_ef 0 30518 0>;
	};

	sdio_pwrseq: sdio-pwrseq {
		compatible = "mmc-pwrseq-simple";
		clocks = <&wifi32k>;
		clock-names = "ext_clock";
		reset-gpios = <&gpio GPIOX_7 GPIO_ACTIVE_LOW>;
	};

	speaker_amplifier: speaker-amplifier {
		compatible = "simple-audio-amplifier";
		sound-name-prefix = "Speaker Amplifier";
		VCC-supply = <&vdd_amp>;
		enable-gpios = <&gpio GPIOH_5 GPIO_ACTIVE_HIGH>;
	};

	vdd_amp: regulator-vdd-amp {
		compatible = "regulator-fixed";
		regulator-name = "vdd_amp";
		regulator-always-on;
		regulator-boot-on;
	};
};

/* ========== eMMC ========== */
&sd_emmc_c {
	status = "okay";
	bus-width = <8>;
	non-removable;
	cap-mmc-highspeed;
	mmc-ddr-1_8v;
	mmc-hs200-1_8v;
	max-frequency = <200000000>;
	vmmc-supply = <&vsys_3v3>;
	vqmmc-supply = <&vddao_1v8>;
};

/* ========== SDIO (WiFi) ========== */
&sd_emmc_a {
	status = "okay";
	bus-width = <4>;
	cap-sd-highspeed;
	sd-uhs-ddr50;
	max-frequency = <200000000>;
	non-removable;
	keep-power-in-suspend;
	vmmc-supply = <&vsys_3v3>;
	vqmmc-supply = <&vddao_1v8>;
	mmc-pwrseq = <&sdio_pwrseq>;
};

/* ========== UART ========== */
&uart_AO {
	status = "okay";
};

/* ========== USB ========== */
&usb {
	status = "okay";
	dr_mode = "host";
};

&usb2_phy0 {
	status = "okay";
	phy-supply = <&vsys_3v3>;
};

&usb2_phy1 {
	status = "okay";
	phy-supply = <&host_vbus>;
};

/* ========== 以太网 ========== */
ðmac {
	status = "okay";
	phy-mode = "rgmii";
};

/* ========== HDMI ========== */
&hdmi_tx {
	status = "okay";
};

&vpu {
	status = "okay";
};

&fb {
	status = "okay";
};

/* ========== CEC ========== */
&cec_AO {
	status = "okay";
};

/* ========== IR ========== */
&ir {
	status = "okay";
};

/* ========== PWM ========== */
&pwm_ab {
	status = "okay";
};

&pwm_ef {
	status = "okay";
};

&pwm_AO_cd {
	status = "okay";
};

/* ========== ADC ========== */
&saradc {
	status = "okay";
	vref-supply = <&vddao_1v8};
};

/* ========== 看门狗 ========== */
&watchdog {
	status = "okay";
};

/* ========== RTC ========== */
&vrtc {
	status = "okay";
};

/* ========== 温度传感器 ========== */
&cpu_thermal {
	polling-delay = <1000>;
	polling-delay-passive = <100>;

	trips {
		cpu_passive: cpu-passive {
			temperature = <85000>;
			hysteresis = <2000>;
			type = "passive";
		};
	};

	cooling-maps {
		map {
			trip = <&cpu_passive>;
			cooling-device = <&gpio_fan 1 1>;
		};
	};
};

/* ========== I2C1 (AW2013 LED) ========== */
&i2c1 {
	status = "okay";
	led-controller@45 {
		compatible = "awinic,aw2013";
		reg = <0x45>;
		#address-cells = <1>;
		#size-cells = <0>;

		led@0 {
			reg = <0>;
			led-max-microamp = <5000>;
		};

		led@1 {
			reg = <1>;
			led-max-microamp = <5000>;
		};

		led@2 {
			reg = <2>;
			led-max-microamp = <5000>;
		};
	};
};

/* ========== I2C2 (DS1307 RTC) ========== */
&i2c2 {
	status = "okay";
	rtc@68 {
		compatible = "dallas,ds1307";
		reg = <0x68>;
	};
};
EOF
        
        echo "=== DTS file created ==="
        cat meson-g12b-xiaoyi-pro.dts | head -30

    - name: Preprocess DTS with CPP
      run: |
        cpp -nostdinc -undef -x assembler-with-cpp \
          -I /tmp/linux-amlogic/include \
          -I /tmp/linux-amlogic/arch/arm64/boot/dts \
          -I /tmp/linux-amlogic/arch/arm64/boot/dts/amlogic \
          -I /tmp/linux-amlogic/include/dt-bindings \
          meson-g12b-xiaoyi-pro.dts > meson-g12b-xiaoyi-pro.preprocessed.dts 2>&1 || true
        
        echo "=== Preprocessed DTS (first 50 lines) ==="
        head -50 meson-g12b-xiaoyi-pro.preprocessed.dts

    - name: Compile DTS to DTB
      run: |
        # 尝试直接编译
        dtc -I dts -O dtb -o meson-g12b-xiaoyi-pro.dtb meson-g12b-xiaoyi-pro.dts 2>&1 || \
        dtc -I dts -O dtb -o meson-g12b-xiaoyi-pro.dtb meson-g12b-xiaoyi-pro.preprocessed.dts 2>&1 || true
        
        # 如果编译成功，反编译验证
        if [ -f meson-g12b-xiaoyi-pro.dtb ]; then
          dtc -I dtb -O dts -o meson-g12b-xiaoyi-pro.decompiled.dts meson-g12b-xiaoyi-pro.dtb
          echo "=== Compilation successful ==="
          ls -la *.dtb
        else
          echo "=== Compilation failed, creating placeholder ==="
          echo "DTB compilation failed. Please check the DTS syntax." > COMPILE_ERROR.txt
        fi

    - name: List output files
      run: |
        echo "=== Current directory contents ==="
        ls -la

    - name: Create release zip
      run: |
        RELEASE_ZIP="/tmp/dtbs.zip"
        zip -9 -r "$RELEASE_ZIP" *.dtb *.dts *.txt 2>/dev/null || true
        echo "RELEASE_ZIP=$RELEASE_ZIP" >> $GITHUB_ENV
        echo "=== ZIP contents ==="
        unzip -l "$RELEASE_ZIP" || echo "ZIP creation failed"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dtb-files
        path: |
          *.dtb
          *.dts
          *.txt
        retention-days: 7

    - name: Set release tag
      id: vars
      run: |
        TAG_NAME="v$(date +'%Y%m%d-%H%M%S')"
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
        echo "Release tag: $TAG_NAME"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        make_latest: true
        tag_name: ${{ env.TAG_NAME }}
        generate_release_notes: true
        files: |
          ${{ env.RELEASE_ZIP }}
