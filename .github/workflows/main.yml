name: Compile XiaoYi Pro DTS to DTB

on:
  workflow_dispatch:  # 手动触发
  push:
    paths:
      - 'dts/*.dts'

permissions:
  contents: write

env:
  APT: sudo apt -y -qq -o=Dpkg::Use-Pty=0
  LINUX_AMLOGIC_GIT: https://github.com/CoreELEC/linux-amlogic.git
  COMMON_DRIVERS_GIT: https://github.com/CoreELEC/common_drivers.git
  LINUX_AMLOGIC_ROOT: /tmp/linux-amlogic
  OUTPUT_DIR: /tmp/output

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install prerequisites
      run: |
        $APT update
        $APT install device-tree-compiler bc bison flex build-essential

    - name: Clone CoreELEC kernel for headers
      run: |
        git clone -q --depth=1 "$LINUX_AMLOGIC_GIT" "$LINUX_AMLOGIC_ROOT"
        cd "$LINUX_AMLOGIC_ROOT"
        git clone -q --depth=1 "$COMMON_DRIVERS_GIT" common_drivers
        ls -la "$LINUX_AMLOGIC_ROOT/common_drivers/arch/arm64/boot/dts/amlogic/"

    - name: Compile DTS to DTB
      run: |
        mkdir -p "$OUTPUT_DIR"
        
        DTS_FILE="${{ github.workspace }}/dts/meson-g12b-a311d-xiaoyi-pro-coreelec.dts"
        
        if [ ! -f "$DTS_FILE" ]; then
          echo "ERROR: DTS file not found!"
          exit 1
        fi
        
        echo "=== Compiling: $(basename $DTS_FILE) ==="
        
        # 使用 cpp 预处理
        cpp -nostdinc -undef -x assembler-with-cpp \
          -I "$LINUX_AMLOGIC_ROOT/include" \
          -I "$LINUX_AMLOGIC_ROOT/common_drivers/include" \
          -I "$LINUX_AMLOGIC_ROOT/arch/arm64/boot/dts" \
          -I "$LINUX_AMLOGIC_ROOT/arch/arm64/boot/dts/amlogic" \
          -I "$LINUX_AMLOGIC_ROOT/arch/arm64/boot/dts/amlogic/overlays" \
          "$DTS_FILE" > "$OUTPUT_DIR/preprocessed.dts" 2>&1 || true
        
        # 检查预处理是否成功
        if [ ! -s "$OUTPUT_DIR/preprocessed.dts" ]; then
          echo "WARNING: Preprocessing failed, trying direct compilation"
          cp "$DTS_FILE" "$OUTPUT_DIR/preprocessed.dts"
        fi
        
        # 编译为 DTB
        dtc -q -I dts -O dtb \
          -o "$OUTPUT_DIR/meson-g12b-a311d-xiaoyi-pro-coreelec.dtb" \
          "$OUTPUT_DIR/preprocessed.dts" 2>&1 || true
        
        # 反编译验证
        if [ -f "$OUTPUT_DIR/meson-g12b-a311d-xiaoyi-pro-coreelec.dtb" ]; then
          echo "=== DTB compiled successfully ==="
          dtc -I dtb -O dts \
            -o "$OUTPUT_DIR/meson-g12b-a311d-xiaoyi-pro-coreelec.decompiled.dts" \
            "$OUTPUT_DIR/meson-g12b-a311d-xiaoyi-pro-coreelec.dtb"
          ls -lh "$OUTPUT_DIR/"
        else
          echo "=== Compilation FAILED ==="
          cat "$OUTPUT_DIR/preprocessed.dts" | head -50
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coreelec-dtb
        path: |
          ${{ env.OUTPUT_DIR }}/*.dtb
          ${{ env.OUTPUT_DIR }}/*.decompiled.dts
          ${{ github.workspace }}/dts/*.dts
        retention-days: 7

    - name: Create Release ZIP
      run: |
        cd "$OUTPUT_DIR"
        RELEASE_ZIP="/tmp/xiaoyi-pro-dtb.zip"
        zip -9 -j "$RELEASE_ZIP" *.dtb *.decompiled.dts 2>/dev/null || true
        cd "${{ github.workspace }}/dts"
        zip -9 -j "$RELEASE_ZIP" *.dts 2>/dev/null || true
        
        echo "RELEASE_ZIP=$RELEASE_ZIP" >> $GITHUB_ENV
        
        echo "=== Release ZIP contents ==="
        unzip -l "$RELEASE_ZIP"
        
        sha256sum --tag "$RELEASE_ZIP" | tee /tmp/releasenotes

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        make_latest: true
        body: |
          ## CoreELEC DTB for CAINIAO XiaoYi Pro
          
          - Device: CAINIAO XiaoYi Pro (Amlogic A311D)
          - Kernel: CoreELEC 4.9.269
          - Features: Fan, LED (AW2013), RTC (DS1307), IR, CEC, Audio Amplifier
          
          ### Files:
          - `meson-g12b-a311d-xiaoyi-pro-coreelec.dtb` - 编译后的设备树文件
          - `meson-g12b-a311d-xiaoyi-pro-coreelec.decompiled.dts` - 反编译用于验证
          - `meson-g12b-a311d-xiaoyi-pro-coreelec.dts` - 原始 DTS 源码
          
          ### SHA256:
