name: Build Custom Device Tree for CoreELEC

on:
  workflow_dispatch:
  push:
    paths:
      - 'dts/*.dts'

permissions:
  contents: write

env:
  LINUX_REPO: https://github.com/CoreELEC/linux-amlogic.git
  COMMON_DRIVERS_REPO: https://github.com/CoreELEC/common_drivers.git
  DTS_SOURCE: ${{ github.workspace }}/my_repo/dts/meson-g12b-xiaoyi-pro.dts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          path: my_repo

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc git texinfo gzip squashfs-tools \
            device-tree-compiler gcc-aarch64-linux-gnu

      - name: Clone CoreELEC kernel repository
        run: |
          git clone --depth=1 "$LINUX_REPO" linux-amlogic
          cd linux-amlogic
          echo "=== Kernel version ==="
          git log --oneline -1

      - name: Clone common_drivers repository
        run: |
          cd linux-amlogic
          git clone --depth=1 "$COMMON_DRIVERS_REPO" common_drivers
          echo "=== common_drivers cloned ==="

      - name: Prepare DTS files
        run: |
          cd linux-amlogic
          
          # 标准内核 DTS 目录
          KERNEL_DTS_DIR="arch/arm64/boot/dts/amlogic/"
          mkdir -p "$KERNEL_DTS_DIR"
          cp "${{ env.DTS_SOURCE }}" "$KERNEL_DTS_DIR/meson-g12b-xiaoyi-pro.dts"
          echo "Copied DTS to: $KERNEL_DTS_DIR"
          
          # common_drivers 目录 (创建软链接指向标准目录的 dtsi 文件)
          COMMON_DTS_DIR="common_drivers/arch/arm64/boot/dts/amlogic/"
          mkdir -p "$COMMON_DTS_DIR"
          cp "${{ env.DTS_SOURCE }}" "$COMMON_DTS_DIR/meson-g12b-xiaoyi-pro.dts"
          
          # 创建软链接到标准目录的 dtsi 文件
          cd "$COMMON_DTS_DIR"
          for dtsi in meson-g12b-s922x.dtsi meson-g12b.dtsi meson-g12.dtsi meson-g12-common.dtsi; do
            ln -sf ../../../../../arch/arm64/boot/dts/amlogic/$dtsi $dtsi 2>/dev/null || true
          done
          cd ../../../..
          
          echo "=== DTS files in tree ==="
          find . -name "meson-g12b-xiaoyi-pro.dts" 2>/dev/null

      - name: Compile DTB using dtc with preprocessing
        run: |
          cd linux-amlogic
          
          DTS_PATH="arch/arm64/boot/dts/amlogic/meson-g12b-xiaoyi-pro.dts"
          
          if [ ! -f "$DTS_PATH" ]; then
            echo "❌ DTS file not found!"
            exit 1
          fi
          
          echo "=== Preprocessing DTS with cpp ==="
          
          # 使用 cpp 预处理，展开所有 #include
          cpp -nostdinc -undef -x assembler-with-cpp \
            -I arch/arm64/boot/dts \
            -I arch/arm64/boot/dts/amlogic \
            -I include \
            -I common_drivers/include \
            "$DTS_PATH" > meson-g12b-xiaoyi-pro.preprocessed.dts 2>&1 || true
          
          # 检查预处理结果
          if [ -s "meson-g12b-xiaoyi-pro.preprocessed.dts" ]; then
            echo "✅ Preprocessing successful"
            echo "=== Preprocessed DTS (first 30 lines) ==="
            head -30 meson-g12b-xiaoyi-pro.preprocessed.dts
          else
            echo "⚠️ Preprocessing produced empty file, trying direct compilation..."
            cp "$DTS_PATH" meson-g12b-xiaoyi-pro.preprocessed.dts
          fi
          
          echo "=== Compiling with dtc ==="
          
          # 使用 dtc 编译预处理后的文件
          dtc -I dts -O dtb \
            -i arch/arm64/boot/dts/amlogic \
            -i arch/arm64/boot/dts \
            -i include \
            -i common_drivers/include \
            -o meson-g12b-xiaoyi-pro.dtb \
            meson-g12b-xiaoyi-pro.preprocessed.dts 2>&1 || {
            echo "⚠️ dtc with preprocessed failed, trying with original DTS..."
            
            # 备选：直接用 dtc 编译原始文件（可能失败）
            dtc -I dts -O dtb \
              -i arch/arm64/boot/dts/amlogic \
              -i arch/arm64/boot/dts \
              -i include \
              -i common_drivers/include \
              -o meson-g12b-xiaoyi-pro.dtb \
              "$DTS_PATH" 2>&1 || true
          }
          
          # 检查结果
          if [ -f "meson-g12b-xiaoyi-pro.dtb" ]; then
            echo "✅ DTB compiled successfully!"
            ls -la meson-g12b-xiaoyi-pro.dtb
            echo "DTB_FILE=meson-g12b-xiaoyi-pro.dtb" >> $GITHUB_ENV
          else
            echo "❌ DTB compilation failed!"
            echo "=== Preprocessed DTS (last 50 lines) ==="
            tail -50 meson-g12b-xiaoyi-pro.preprocessed.dts
            exit 1
          fi

      - name: Verify DTB
        run: |
          if [ -f "meson-g12b-xiaoyi-pro.dtb" ]; then
            echo "=== DTB file info ==="
            file meson-g12b-xiaoyi-pro.dtb
            ls -la meson-g12b-xiaoyi-pro.dtb
            
            # 反编译验证
            dtc -I dtb -O dts -o meson-g12b-xiaoyi-pro.decompiled.dts \
              meson-g12b-xiaoyi-pro.dtb 2>/dev/null || echo "Decompilation skipped"
            
            if [ -f "meson-g12b-xiaoyi-pro.decompiled.dts" ]; then
              echo "=== Decompiled DTS (first 30 lines) ==="
              head -30 meson-g12b-xiaoyi-pro.decompiled.dts
              echo ""
              echo "=== DTB structure ==="
              dtc -I dtb -O dts --sort meson-g12b-xiaoyi-pro.dtb 2>/dev/null | head -50 || true
            fi
          else
            echo "❌ No DTB file to verify"
            exit 1
          fi

      - name: Upload DTB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyi-pro-dtb
          path: |
            meson-g12b-xiaoyi-pro.dtb
            meson-g12b-xiaoyi-pro.decompiled.dts
            meson-g12b-xiaoyi-pro.preprocessed.dts
          retention-days: 7

      - name: Create Release
        run: |
          RELEASE_TAG="v$(date +'%Y%m%d-%H%M%S')"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          if [ -f "meson-g12b-xiaoyi-pro.dtb" ]; then
            zip -9 xiaoyi-pro-dtb.zip meson-g12b-xiaoyi-pro.dtb \
              meson-g12b-xiaoyi-pro.decompiled.dts 2>/dev/null || \
              zip -9 xiaoyi-pro-dtb.zip meson-g12b-xiaoyi-pro.dtb
            echo "✅ ZIP created successfully."
          else
            echo "❌ No DTB file to zip."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            xiaoyi-pro-dtb.zip
