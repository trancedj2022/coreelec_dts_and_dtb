name: Build Custom Device Tree for CoreELEC

on:
  workflow_dispatch:
  push:
    paths:
      - 'dts/*.dts'

permissions:
  contents: write

env:
  PROJECT: Amlogic-ce
  DEVICE: Amlogic-ng
  COREELEC_REPO: https://github.com/CoreELEC/CoreELEC.git
  LINUX_REPO: https://github.com/CoreELEC/linux-amlogic.git
  # 使用 github.workspace 确保路径始终正确
  DTS_SOURCE: ${{ github.workspace }}/my_repo/dts/meson-g12b-xiaoyi-pro.dts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          path: my_repo  # 克隆到 my_repo 子目录

      - name: Debug - List files in repository
        run: |
          echo "=== Contents of workspace ==="
          ls -la ${{ github.workspace }}
          echo "=== Contents of my_repo ==="
          ls -la ${{ github.workspace }}/my_repo
          echo "=== Contents of dts directory ==="
          ls -la ${{ github.workspace }}/my_repo/dts/ || echo "dts directory not found"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc git texinfo gzip squashfs-tools

      - name: Clone CoreELEC main repository
        run: |
          git clone --depth=1 "$COREELEC_REPO" CoreELEC

      - name: Clone CoreELEC kernel repository
        run: |
          cd CoreELEC
          git clone --depth=1 "$LINUX_REPO" projects/$PROJECT/devices/$DEVICE/linux

      - name: Inject custom DTS into kernel source
        run: |
          cd CoreELEC
          KERNEL_DTS_DIR="projects/$PROJECT/devices/$DEVICE/linux/arch/arm64/boot/dts/amlogic/"
          mkdir -p "$KERNEL_DTS_DIR"
          
          # 使用环境变量引用 DTS 文件
          echo "Looking for DTS file at: ${{ env.DTS_SOURCE }}"
          if [ ! -f "${{ env.DTS_SOURCE }}" ]; then
            echo "ERROR: DTS file not found at specified path"
            echo "Current directory contents:"
            ls -la ${{ github.workspace }}/my_repo/
            exit 1
          fi
          
          cp "${{ env.DTS_SOURCE }}" "$KERNEL_DTS_DIR/meson-g12b-xiaoyi-pro.dts"
          
          # 编辑内核的 Makefile，添加你的 dtb 到编译列表
          KERNEL_MAKEFILE="projects/$PROJECT/devices/$DEVICE/linux/arch/arm64/boot/dts/amlogic/Makefile"
          if ! grep -q "meson-g12b-xiaoyi-pro" "$KERNEL_MAKEFILE"; then
            echo "dtb-\$(CONFIG_ARCH_MESON) += meson-g12b-xiaoyi-pro.dtb" >> "$KERNEL_MAKEFILE"
          fi
          echo "DTS file copied successfully."

      - name: Build the entire kernel package
        run: |
          cd CoreELEC
          # 构建整个内核包
          ./scripts/build arm kernel

      - name: Locate and extract custom DTB
        id: prepare_dtb
        run: |
          cd CoreELEC
          # 在构建输出目录中查找生成的 dtb 文件
          DTB_PATH=$(find ./build.* -path "*/amlogic/meson-g12b-xiaoyi-pro.dtb" | head -n 1)
          
          if [ -z "$DTB_PATH" ]; then
            echo "::error::Custom DTB file not found in build output!"
            exit 1
          fi
          
          # 将 dtb 文件复制到工作区根目录
          cp "$DTB_PATH" meson-g12b-xiaoyi-pro.dtb
          echo "DTB_FILE=meson-g12b-xiaoyi-pro.dtb" >> $GITHUB_ENV
          echo "::notice::Custom DTB file found and prepared: $DTB_PATH"

      - name: Upload DTB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyi-pro-dtb
          path: ${{ env.DTB_FILE }}
          retention-days: 7

      - name: Create Release
        run: |
          RELEASE_TAG="v$(date +'%Y%m%d-%H%M%S')"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          zip -9 xiaoyi-pro-dtb.zip ${{ env.DTB_FILE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            xiaoyi-pro-dtb.zip
