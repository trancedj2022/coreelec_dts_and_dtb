name: Build Custom Device Tree for CoreELEC

on:
  workflow_dispatch:
  push:
    paths:
      - 'dts/*.dts'

permissions:
  contents: write

env:
  PROJECT: Amlogic-ce
  DEVICE: Amlogic-ng
  ARCH: aarch64
  COREELEC_REPO: https://github.com/CoreELEC/CoreELEC.git
  LINUX_REPO: https://github.com/CoreELEC/linux-amlogic.git
  DTS_SOURCE: ${{ github.workspace }}/my_repo/dts/meson-g12b-xiaoyi-pro.dts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          path: my_repo

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc git texinfo gzip squashfs-tools device-tree-compiler

      - name: Install build dependencies
        run: |
           sudo apt-get update
           sudo apt-get install -y make gcc git texinfo gzip squashfs-tools \
           device-tree-compiler gcc-aarch64-linux-gnu   

      - name: Clone CoreELEC repositories
        run: |
          git clone --depth=1 "$COREELEC_REPO" CoreELEC
          cd CoreELEC
          git clone --depth=1 "$LINUX_REPO" projects/$PROJECT/devices/$DEVICE/linux

      - name: List available configurations (debug)
        run: |
          cd CoreELEC
          echo "=== Available architectures in config/ ==="
          ls -la config/arch.*
          echo ""
          echo "=== Project device directory ==="
          ls -la projects/$PROJECT/devices/$DEVICE/ 2>/dev/null || echo "Device directory not found"
          echo ""
          echo "=== Kernel directory ==="
          ls -la projects/$PROJECT/devices/$DEVICE/linux/ 2>/dev/null | head -10

      - name: Inject custom DTS into kernel source
        run: |
          cd CoreELEC
          KERNEL_DTS_DIR="projects/$PROJECT/devices/$DEVICE/linux/arch/arm64/boot/dts/amlogic/"
          mkdir -p "$KERNEL_DTS_DIR"
          
          if [ ! -f "${{ env.DTS_SOURCE }}" ]; then
            echo "ERROR: DTS file not found at ${{ env.DTS_SOURCE }}"
            echo "Contents of my_repo:"
            ls -la ${{ github.workspace }}/my_repo/
            exit 1
          fi
          
          cp "${{ env.DTS_SOURCE }}" "$KERNEL_DTS_DIR/meson-g12b-xiaoyi-pro.dts"
          echo "DTS file copied to: $KERNEL_DTS_DIR"
          
          KERNEL_MAKEFILE="projects/$PROJECT/devices/$DEVICE/linux/arch/arm64/boot/dts/amlogic/Makefile"
          if ! grep -q "meson-g12b-xiaoyi-pro" "$KERNEL_MAKEFILE"; then
            echo "dtb-\$(CONFIG_ARCH_MESON) += meson-g12b-xiaoyi-pro.dtb" >> "$KERNEL_MAKEFILE"
            echo "Added DTB to Makefile"
          fi

      - name: Build kernel package
        run: |
          cd CoreELEC
          
          # 方法1: 通过环境变量设置架构
          echo "=== Building with ARCH=$ARCH ==="
          export ARCH=$ARCH
          export PROJECT=$PROJECT
          
          # 尝试构建内核包
          ./scripts/build $PROJECT kernel || {
            echo "=== Build with project failed, trying direct approach ==="
            # 方法2: 直接使用内核 Makefile
            cd projects/$PROJECT/devices/$DEVICE/linux
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- meson-g12b-xiaoyi-pro.dtb
          }

      - name: Locate and extract custom DTB
        id: prepare_dtb
        run: |
          cd CoreELEC
          
          echo "=== Searching for custom DTB file ==="
          
          # 搜索所有可能的位置
          DTB_PATH=$(find . -name "meson-g12b-xiaoyi-pro.dtb" -type f 2>/dev/null | head -n 1)
          
          if [ -z "$DTB_PATH" ]; then
            echo "::warning::Custom DTB not found in expected path. Searching for any DTB files..."
            DTB_PATH=$(find . -name "*.dtb" -type f 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$DTB_PATH" ]; then
            echo "::error::No DTB file found in build output!"
            echo "Build directory contents:"
            find . -name "*.dtb" 2>/dev/null | head -20 || echo "No DTB files found"
            exit 1
          fi
          
          echo "Found DTB at: $DTB_PATH"
          cp "$DTB_PATH" meson-g12b-xiaoyi-pro.dtb
          echo "DTB_FILE=meson-g12b-xiaoyi-pro.dtb" >> $GITHUB_ENV
          echo "::notice::DTB file prepared successfully"
          
          # 显示文件信息
          file meson-g12b-xiaoyi-pro.dtb
          ls -la meson-g12b-xiaoyi-pro.dtb

      - name: Decompile DTB for verification
        run: |
          if [ -f "meson-g12b-xiaoyi-pro.dtb" ]; then
            dtc -I dtb -O dts -o meson-g12b-xiaoyi-pro.decompiled.dts meson-g12b-xiaoyi-pro.dtb 2>/dev/null || echo "Decompilation skipped"
            echo "DTB decompiled for verification."
            ls -la *.dts *.dtb 2>/dev/null
          fi

      - name: Upload DTB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyi-pro-dtb
          path: |
            meson-g12b-xiaoyi-pro.dtb
            meson-g12b-xiaoyi-pro.decompiled.dts
          retention-days: 7

      - name: Create Release
        run: |
          RELEASE_TAG="v$(date +'%Y%m%d-%H%M%S')"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          zip -9 xiaoyi-pro-dtb.zip meson-g12b-xiaoyi-pro.dtb meson-g12b-xiaoyi-pro.decompiled.dts 2>/dev/null || zip -9 xiaoyi-pro-dtb.zip meson-g12b-xiaoyi-pro.dtb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            xiaoyi-pro-dtb.zip
