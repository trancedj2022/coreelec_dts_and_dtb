name: Build Custom Device Tree for CoreELEC

on:
  workflow_dispatch:
  push:
    paths:
      - 'dts/*.dts'

permissions:
  contents: write

env:
  LINUX_REPO: https://github.com/CoreELEC/linux-amlogic.git
  COMMON_DRIVERS_REPO: https://github.com/CoreELEC/common_drivers.git
  DTS_SOURCE: ${{ github.workspace }}/my_repo/dts/meson-g12b-xiaoyi-pro.dts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          path: my_repo

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc git texinfo gzip squashfs-tools \
            device-tree-compiler gcc-aarch64-linux-gnu

      - name: Clone CoreELEC kernel repository
        run: |
          git clone --depth=1 "$LINUX_REPO" linux-amlogic
          cd linux-amlogic
          echo "=== Kernel version ==="
          git log --oneline -1

      - name: Clone common_drivers repository
        run: |
          cd linux-amlogic
          git clone --depth=1 "$COMMON_DRIVERS_REPO" common_drivers
          echo "=== common_drivers cloned ==="

      - name: Prepare DTS files in all required locations
        run: |
          cd linux-amlogic
          
          # 1. 标准内核 DTS 目录
          KERNEL_DTS_DIR="arch/arm64/boot/dts/amlogic/"
          mkdir -p "$KERNEL_DTS_DIR"
          cp "${{ env.DTS_SOURCE }}" "$KERNEL_DTS_DIR/meson-g12b-xiaoyi-pro.dts"
          echo "Copied to: $KERNEL_DTS_DIR"
          
          # 2. common_drivers 目录 (创建软链接指向标准目录)
          COMMON_DTS_DIR="common_drivers/arch/arm64/boot/dts/amlogic/"
          mkdir -p "$COMMON_DTS_DIR"
          # 复制 .dts 文件
          cp "${{ env.DTS_SOURCE }}" "$COMMON_DTS_DIR/meson-g12b-xiaoyi-pro.dts"
          # 创建软链接指向标准目录的 .dtsi 文件
          ln -sf ../../../../../arch/arm64/boot/dts/amlogic/meson-g12b-s922x.dtsi \
            "$COMMON_DTS_DIR/meson-g12b-s922x.dtsi" 2>/dev/null || \
          ln -sf ../../../../arch/arm64/boot/dts/amlogic/meson-g12b-s922x.dtsi \
            "$COMMON_DTS_DIR/meson-g12b-s922x.dtsi" 2>/dev/null || true
          echo "Created symlinks in: $COMMON_DTS_DIR"
          
          # 3. 也复制到 common_drivers/dts/amlogic/ (备选路径)
          COMMON_DTS_DIR2="common_drivers/dts/amlogic/"
          mkdir -p "$COMMON_DTS_DIR2"
          cp "${{ env.DTS_SOURCE }}" "$COMMON_DTS_DIR2/meson-g12b-xiaoyi-pro.dts" 2>/dev/null || true
          
          echo "=== DTS files in kernel tree ==="
          find . -name "meson-g12b-xiaoyi-pro.dts" 2>/dev/null
          echo ""
          echo "=== DTSI files in kernel tree ==="
          find arch/arm64/boot/dts/amlogic -name "*.dtsi" 2>/dev/null | head -10

      - name: Add DTB to Makefiles
        run: |
          cd linux-amlogic
          
          # 内核 Makefile
          KERNEL_MAKEFILE="arch/arm64/boot/dts/amlogic/Makefile"
          if ! grep -q "meson-g12b-xiaoyi-pro" "$KERNEL_MAKEFILE"; then
            echo "dtb-\$(CONFIG_ARCH_MESON) += meson-g12b-xiaoyi-pro.dtb" >> "$KERNEL_MAKEFILE"
            echo "Added to kernel Makefile"
          fi
          
          # common_drivers Makefile
          COMMON_MAKEFILE="common_drivers/arch/arm64/boot/dts/amlogic/Makefile"
          mkdir -p "$(dirname "$COMMON_MAKEFILE")"
          if [ ! -f "$COMMON_MAKEFILE" ]; then
            echo "# CoreELEC common_drivers DTS Makefile" > "$COMMON_MAKEFILE"
          fi
          if ! grep -q "meson-g12b-xiaoyi-pro" "$COMMON_MAKEFILE"; then
            echo "dtb-\$(CONFIG_ARCH_MESON) += meson-g12b-xiaoyi-pro.dtb" >> "$COMMON_MAKEFILE"
            echo "Added to common_drivers Makefile"
          fi

      - name: Compile DTB using kernel build system
        run: |
          cd linux-amlogic
          
          # 配置内核 (只生成 .config)
          echo "=== Configuring kernel ==="
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          
          # 编译 DTB
          echo "=== Compiling DTB ==="
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            meson-g12b-xiaoyi-pro.dtb 2>&1 | tee /tmp/build.log || {
            echo "Kernel build failed, checking if DTB was generated anyway..."
          }
          
          # 查找生成的 DTB
          echo "=== Searching for DTB ==="
          find . -name "meson-g12b-xiaoyi-pro.dtb" 2>/dev/null
          
          # 复制到工作区
          DTB_PATH=$(find . -name "meson-g12b-xiaoyi-pro.dtb" 2>/dev/null | head -n 1)
          if [ -n "$DTB_PATH" ]; then
            cp "$DTB_PATH" meson-g12b-xiaoyi-pro.dtb
            echo "DTB_FILE=meson-g12b-xiaoyi-pro.dtb" >> $GITHUB_ENV
            echo "✅ DTB found and copied!"
            ls -la meson-g12b-xiaoyi-pro.dtb
          else
            echo "⚠️ Kernel build didn't generate DTB, trying direct dtc compilation..."
            
            # 备用方案：直接使用 dtc 编译
            DTS_PATH=$(find arch/arm64/boot/dts/amlogic -name "meson-g12b-xiaoyi-pro.dts" 2>/dev/null | head -n 1)
            if [ -z "$DTS_PATH" ]; then
              DTS_PATH=$(find common_drivers -name "meson-g12b-xiaoyi-pro.dts" 2>/dev/null | head -n 1)
            fi
            
            if [ -n "$DTS_PATH" ] && [ -f "$DTS_PATH" ]; then
              echo "Found DTS at: $DTS_PATH"
              # 使用 dtc 直接编译，添加必要的 include 路径
              dtc -I dts -O dtb \
                -i arch/arm64/boot/dts/amlogic \
                -i arch/arm64/boot/dts \
                -i include \
                -i common_drivers/include \
                -o meson-g12b-xiaoyi-pro.dtb \
                "$DTS_PATH" 2>&1 || true
              
              if [ -f "meson-g12b-xiaoyi-pro.dtb" ]; then
                echo "DTB_FILE=meson-g12b-xiaoyi-pro.dtb" >> $GITHUB_ENV
                echo "✅ DTB compiled successfully with dtc!"
              fi
            else
              echo "❌ No DTS file found for direct compilation"
              exit 1
            fi
          fi

      - name: Verify DTB
        run: |
          if [ -f "meson-g12b-xiaoyi-pro.dtb" ]; then
            echo "=== DTB file info ==="
            file meson-g12b-xiaoyi-pro.dtb
            ls -la meson-g12b-xiaoyi-pro.dtb
            
            # 反编译验证
            dtc -I dtb -O dts -o meson-g12b-xiaoyi-pro.decompiled.dts \
              meson-g12b-xiaoyi-pro.dtb 2>/dev/null || echo "Decompilation skipped"
            
            if [ -f "meson-g12b-xiaoyi-pro.decompiled.dts" ]; then
              echo "=== Decompiled DTS (first 20 lines) ==="
              head -20 meson-g12b-xiaoyi-pro.decompiled.dts
            fi
          else
            echo "❌ No DTB file to verify"
            exit 1
          fi

      - name: Upload DTB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyi-pro-dtb
          path: |
            meson-g12b-xiaoyi-pro.dtb
            meson-g12b-xiaoyi-pro.decompiled.dts
          retention-days: 7

      - name: Create Release
        run: |
          RELEASE_TAG="v$(date +'%Y%m%d-%H%M%S')"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          if [ -f "meson-g12b-xiaoyi-pro.dtb" ]; then
            zip -9 xiaoyi-pro-dtb.zip meson-g12b-xiaoyi-pro.dtb \
              meson-g12b-xiaoyi-pro.decompiled.dts 2>/dev/null || \
              zip -9 xiaoyi-pro-dtb.zip meson-g12b-xiaoyi-pro.dtb
            echo "✅ ZIP created successfully."
          else
            echo "❌ No DTB file to zip."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            xiaoyi-pro-dtb.zip
