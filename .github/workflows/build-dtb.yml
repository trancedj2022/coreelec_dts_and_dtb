name: Build Custom Device Tree for CoreELEC

on:
  workflow_dispatch:
  push:
    paths:
      - 'dts/*.dts'

permissions:
  contents: write

env:
  PROJECT: Amlogic-ce
  DEVICE: Amlogic-ng
  COREELEC_REPO: https://github.com/CoreELEC/CoreELEC.git
  LINUX_REPO: https://github.com/CoreELEC/linux-amlogic.git
  DTS_SOURCE: ${{ github.workspace }}/my_repo/dts/meson-g12b-xiaoyi-pro.dts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          path: my_repo

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc git texinfo gzip squashfs-tools

      - name: Clone CoreELEC repositories
        run: |
          git clone --depth=1 "$COREELEC_REPO" CoreELEC
          cd CoreELEC
          git clone --depth=1 "$LINUX_REPO" projects/$PROJECT/devices/$DEVICE/linux

      - name: List available architectures (debug)
        run: |
          cd CoreELEC
          echo "=== Available architectures in config/ ==="
          ls -la config/
          echo ""
          echo "=== Architecture files ==="
          find config/ -name "*.conf" | head -20

      - name: Inject custom DTS into kernel source
        run: |
          cd CoreELEC
          KERNEL_DTS_DIR="projects/$PROJECT/devices/$DEVICE/linux/arch/arm64/boot/dts/amlogic/"
          mkdir -p "$KERNEL_DTS_DIR"
          cp "${{ env.DTS_SOURCE }}" "$KERNEL_DTS_DIR/meson-g12b-xiaoyi-pro.dts"
          
          KERNEL_MAKEFILE="projects/$PROJECT/devices/$DEVICE/linux/arch/arm64/boot/dts/amlogic/Makefile"
          if ! grep -q "meson-g12b-xiaoyi-pro" "$KERNEL_MAKEFILE"; then
            echo "dtb-\$(CONFIG_ARCH_MESON) += meson-g12b-xiaoyi-pro.dtb" >> "$KERNEL_MAKEFILE"
          fi

      - name: Build kernel with correct architecture
        run: |
          cd CoreELEC
          
          # 首先尝试 aarch64（最常见的 Amlogic 64位架构）
          echo "=== Trying architecture: aarch64 ==="
          if ./scripts/build aarch64 kernel; then
            echo "SUCCESS: Built with aarch64"
            exit 0
          fi
          
          # 如果 aarch64 失败，尝试 arm64
          echo "=== aarch64 failed, trying architecture: arm64 ==="
          if ./scripts/build arm64 kernel; then
            echo "SUCCESS: Built with arm64"
            exit 0
          fi
          
          # 如果 arm64 也失败，尝试 arm
          echo "=== arm64 failed, trying architecture: arm ==="
          if ./scripts/build arm kernel; then
            echo "SUCCESS: Built with arm"
            exit 0
          fi
          
          # 如果所有常见架构都失败，输出可用架构列表
          echo "ERROR: All common architectures failed."
          echo "Available configurations in config/ directory:"
          ls -la config/
          exit 1

      - name: Locate and extract custom DTB
        id: prepare_dtb
        run: |
          cd CoreELEC
          echo "=== Searching for custom DTB file ==="
          DTB_PATH=$(find . -path "*/amlogic/meson-g12b-xiaoyi-pro.dtb" -type f | head -n 1)
          
          if [ -z "$DTB_PATH" ]; then
            echo "::warning::Custom DTB not found in expected path. Searching for any DTB files..."
            DTB_PATH=$(find ./build.* -name "*.dtb" -type f | head -n 1)
          fi
          
          if [ -z "$DTB_PATH" ]; then
            echo "::error::No DTB file found in build output!"
            echo "Build directory contents:"
            ls -la ./build.*/ 2>/dev/null || echo "No build directories found"
            exit 1
          fi
          
          echo "Found DTB at: $DTB_PATH"
          cp "$DTB_PATH" meson-g12b-xiaoyi-pro.dtb
          echo "DTB_FILE=meson-g12b-xiaoyi-pro.dtb" >> $GITHUB_ENV

      - name: Upload DTB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyi-pro-dtb
          path: ${{ env.DTB_FILE }}
          retention-days: 7

      - name: Create Release
        run: |
          RELEASE_TAG="v$(date +'%Y%m%d-%H%M%S')"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          zip -9 xiaoyi-pro-dtb.zip ${{ env.DTB_FILE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            xiaoyi-pro-dtb.zip
