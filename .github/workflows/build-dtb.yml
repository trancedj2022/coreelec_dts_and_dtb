name: Build Custom Device Tree for CoreELEC

on:
  workflow_dispatch:
  push:
    paths:
      - 'dts/*.dts'

permissions:
  contents: write

env:
  LINUX_REPO: https://github.com/CoreELEC/linux-amlogic.git
  COMMON_DRIVERS_REPO: https://github.com/CoreELEC/common_drivers.git
  DTS_SOURCE: ${{ github.workspace }}/my_repo/dts/meson-g12b-xiaoyi-pro.dts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          path: my_repo

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc git texinfo gzip squashfs-tools \
            device-tree-compiler gcc-aarch64-linux-gnu

      - name: Clone CoreELEC kernel repository
        run: |
          git clone --depth=1 "$LINUX_REPO" linux-amlogic
          cd linux-amlogic
          echo "=== Kernel version ==="
          git log --oneline -1
          echo ""
          echo "=== Checking for common_drivers requirement ==="
          grep -r "common_drivers" . 2>/dev/null | head -5 || echo "No reference found"

      - name: Clone common_drivers repository
        run: |
          # common_drivers 必须放在内核源码树的 common_drivers 目录下
          cd linux-amlogic
          git clone --depth=1 "$COMMON_DRIVERS_REPO" common_drivers
          echo "=== common_drivers cloned ==="
          ls -la common_drivers/

      - name: Copy DTS to kernel tree
        run: |
          cd linux-amlogic
          
          # 复制 DTS 到内核设备树目录
          cp "${{ env.DTS_SOURCE }}" arch/arm64/boot/dts/amlogic/meson-g12b-xiaoyi-pro.dts
          echo "DTS file copied successfully."
          
          # 检查 Makefile 是否包含我们的 DTB
          MAKE_FILE="arch/arm64/boot/dts/amlogic/Makefile"
          if ! grep -q "meson-g12b-xiaoyi-pro" "$MAKE_FILE"; then
            echo "dtb-\$(CONFIG_ARCH_MESON) += meson-g12b-xiaoyi-pro.dtb" >> "$MAKE_FILE"
            echo "Added DTB to Makefile"
          fi
          
          echo "=== Makefile entries ==="
          grep -i "xiaoyi" "$MAKE_FILE" || echo "No xiaoyi entry found"

      - name: Compile DTB directly
        run: |
          cd linux-amlogic
          
          # 配置内核（现在 common_drivers 已存在）
          echo "=== Configuring kernel ==="
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          
          # 只编译我们的 DTB
          echo "=== Compiling DTB ==="
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            meson-g12b-xiaoyi-pro.dtb
          
          # 查找生成的 DTB
          echo "=== Searching for DTB ==="
          find . -name "meson-g12b-xiaoyi-pro.dtb"
          
          # 复制到工作区
          DTB_PATH=$(find . -name "meson-g12b-xiaoyi-pro.dtb" | head -n 1)
          if [ -n "$DTB_PATH" ]; then
            cp "$DTB_PATH" meson-g12b-xiaoyi-pro.dtb
            echo "DTB_FILE=meson-g12b-xiaoyi-pro.dtb" >> $GITHUB_ENV
            echo "DTB found and copied!"
            echo "DTB size:"
            ls -la meson-g12b-xiaoyi-pro.dtb
          else
            echo "::error::DTB file not found!"
            echo "Searching for any DTB files..."
            find . -name "*.dtb" | head -10
            exit 1
          fi

      - name: Decompile DTB for verification
        run: |
          if [ -f "meson-g12b-xiaoyi-pro.dtb" ]; then
            dtc -I dtb -O dts -o meson-g12b-xiaoyi-pro.decompiled.dts meson-g12b-xiaoyi-pro.dtb 2>/dev/null || echo "Decompilation skipped"
            echo "=== DTB info ==="
            file meson-g12b-xiaoyi-pro.dtb
            ls -la meson-g12b-xiaoyi-pro.dtb
            echo ""
            echo "=== Decompiled DTS (first 30 lines) ==="
            head -30 meson-g12b-xiaoyi-pro.decompiled.dts 2>/dev/null || echo "No decompiled file"
          fi

      - name: Upload DTB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyi-pro-dtb
          path: |
            meson-g12b-xiaoyi-pro.dtb
            meson-g12b-xiaoyi-pro.decompiled.dts
          retention-days: 7

      - name: Create Release
        run: |
          RELEASE_TAG="v$(date +'%Y%m%d-%H%M%S')"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          if [ -f "meson-g12b-xiaoyi-pro.dtb" ]; then
            zip -9 xiaoyi-pro-dtb.zip meson-g12b-xiaoyi-pro.dtb meson-g12b-xiaoyi-pro.decompiled.dts 2>/dev/null || \
              zip -9 xiaoyi-pro-dtb.zip meson-g12b-xiaoyi-pro.dtb
            echo "ZIP created successfully."
          else
            echo "No DTB file to zip."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            xiaoyi-pro-dtb.zip
